name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # DATABASE_URL points at the COMMITTED, seeded supply_chain.db — the same
      # database Render serves from (render.yaml) and the same one a developer's
      # backend/.env points at locally.
      #
      # It used to say `sqlite:///./test.db`, i.e. an empty file that SQLAlchemy
      # created on first connect, and that single line is why this workflow was
      # red from 2026-08-18 to 2026-08-23 while the identical suite was green on
      # every laptop:
      #
      #   * the lead-time feature schema is resolved partly from PRODUCTION
      #     coverage — `measure_serve_coverage()` asks "is this column actually
      #     populated?" and `serve_availability()` drops any feature below the
      #     floor. Against an empty database coverage is unmeasurable, and
      #     unmeasurable is deliberately treated as "do not block admission", so
      #     `packaging` (populated on 7.0% of real offers, and excluded from the
      #     committed artifact for exactly that reason) came back in and the
      #     design matrix recomputed from the panel grew 11 phantom one-hot
      #     columns — failing the schema contract and the held-out baseline gate.
      #   * `/graph/simulate` builds its graph from the same database, so an
      #     empty one made component ids 1–3 unknown → 404 instead of 200/503.
      #
      # None of those were model or code defects; all three were this line. The
      # tests still get their own scratch database via the `client` fixture
      # (tests/conftest.py -> test_hardening.db); this is the *ambient*
      # production database the gates measure against, and the suite does not
      # write to it.
      - name: Write .env
        working-directory: backend
        run: |
          echo "DATABASE_URL=sqlite:///./supply_chain.db" >> .env
          echo "SECRET_KEY=ci-test-secret-key-32chars-padding" >> .env
          echo "DEBUG=true" >> .env

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q --tb=short -m "not slow"

  backend-lint:
    name: Backend lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app

      - name: Mypy type-check
        working-directory: backend
        run: mypy app

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
