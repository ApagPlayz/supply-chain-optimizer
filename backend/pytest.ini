[pytest]
markers =
    slow: marks tests that run the full benchmark pipeline integration
    model_ci: a MODEL CI GATE — an automated check that a defect which has actually
        shipped from this repo cannot ship again (train/serve schema divergence, a
        model that loses to its own baseline, a collapsed serve-time answer rate, a
        near-constant predictor, an endpoint that cannot accept its model's inputs,
        an artifact with no provenance). Run alone with `-m model_ci`; the
        `model-ci` GitHub workflow does exactly that with MODEL_CI_STRICT=1, which
        turns a SKIPPED gate into a failure. See docs/MODEL_CI.md.
